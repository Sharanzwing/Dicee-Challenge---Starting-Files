<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dicee Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 id="title">Refresh Me</h1>
        <p class="subtitle">Click roll or refresh the page to battle!</p>
      </header>

      <div class="score-board">
        <div class="score-item">Player 1: <span id="p1-score">0</span></div>
        <div class="score-divider">VS</div>
        <div class="score-item">Player 2: <span id="p2-score">0</span></div>
      </div>

      <main class="dice-wrapper">
        <div class="dice dice-card" id="card1">
          <p class="player-name">Player 1</p>
          <div class="dice-img-box">
            <img class="img1" src="images/dice6.png" alt="Player 1 dice" />
          </div>
        </div>

        <div class="dice dice-card" id="card2">
          <p class="player-name">Player 2</p>
          <div class="dice-img-box">
            <img class="img2" src="images/dice6.png" alt="Player 2 dice" />
          </div>
        </div>
      </main>

      <div class="action-section">
        <button id="roll-btn" class="roll-btn" type="button">
          <span class="btn-icon">🎲</span> Roll Dice
        </button>
      </div>
    </div>

    <footer>www 🎲 App Brewery 🎲 com</footer>

    <script src="index.js" charset="utf-8"></script>
  </body>
</html>
